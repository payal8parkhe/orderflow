spring:
  application:
    name: catalog-service-test

  datasource:
    url: jdbc:h2:mem:catalogtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  cache:
    type: simple

  kafka:
    bootstrap-servers: localhost:9092

app:
  jwt:
    secret: OrderFlowSecretKeyForJWTTokenGenerationWhichMustBeAtLeast256BitsLong!
    expiration-ms: 86400000

server:
  port: 0
