services:
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres
    environment:
      POSTGRES_DB: orderflow_order_db
      POSTGRES_USER: orderflow_user
      POSTGRES_PASSWORD: orderflow_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow_user -d orderflow_order_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orderflow-network

  redis:
    image: redis:7-alpine
    container_name: orderflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orderflow-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: orderflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - orderflow-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: orderflow-order-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow_order_db
      SPRING_DATASOURCE_USERNAME: orderflow_user
      SPRING_DATASOURCE_PASSWORD: orderflow_pass
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - orderflow-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: orderflow-payment-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow_payment_db
      SPRING_DATASOURCE_USERNAME: orderflow_user
      SPRING_DATASOURCE_PASSWORD: orderflow_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ORDER_SERVICE_URL: http://order-service:8081
    networks:
      - orderflow-network

  delivery-service:
    build:
      context: ./delivery-service
      dockerfile: Dockerfile
    container_name: orderflow-delivery-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow_delivery_db
      SPRING_DATASOURCE_USERNAME: orderflow_user
      SPRING_DATASOURCE_PASSWORD: orderflow_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - orderflow-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: orderflow-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow_notification_db
      SPRING_DATASOURCE_USERNAME: orderflow_user
      SPRING_DATASOURCE_PASSWORD: orderflow_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - orderflow-network

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: orderflow-catalog-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow_catalog_db
      SPRING_DATASOURCE_USERNAME: orderflow_user
      SPRING_DATASOURCE_PASSWORD: orderflow_pass
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - orderflow-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: orderflow-api-gateway
    depends_on:
      - order-service
      - payment-service
      - delivery-service
      - notification-service
      - catalog-service
      - kafka
    ports:
      - "8080:8080"
    environment:
      ORDER_SERVICE_URL: http://order-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8082
      DELIVERY_SERVICE_URL: http://delivery-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      CATALOG_SERVICE_URL: http://catalog-service:8085
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - orderflow-network

networks:
  orderflow-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
