spring:
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/orderflow_payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:orderflow_user}
    password: ${SPRING_DATASOURCE_PASSWORD:orderflow_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.orderflow.*,java.util,java.lang"

app:
  jwt:
    secret: ${APP_JWT_SECRET:OrderFlowSecretKeyForJWTTokenGenerationWhichMustBeAtLeast256BitsLong!}
    expiration-ms: 86400000

order:
  service:
    url: ${ORDER_SERVICE_URL:http://localhost:8081}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.orderflow: INFO
    org.springframework.security: INFO
    org.springframework.kafka: INFO
